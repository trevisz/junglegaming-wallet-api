services:
  postgres:
    image: postgres:15-alpine
    container_name: jungle_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-jungle_wagering}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-jungle_wagering}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ministack:
    image: ministackorg/ministack:1.5.24
    container_name: jungle_ministack
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=us-east-1

volumes:
  pgdata:
